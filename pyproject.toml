[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "eesd"
version = "0.1.0"
description = "Effective-Evidence Self-Distillation for execution-guided coding agents"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["numpy>=1.26,<3", "PyYAML>=6,<7"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
ml = [
  "torch>=2.4,<3",
  "transformers>=4.51,<5",
  "peft>=0.14,<0.19",
  "datasets>=3,<5",
  "accelerate>=1.2,<2",
  "bitsandbytes>=0.45,<0.49",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/eesd"]

